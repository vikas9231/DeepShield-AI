<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | DeepShield AI</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="login-header">

            <h1>DeepShield <span>AI</span></h1>

            <p>Create Account</p>

            <small>Join DeepShield AI and start detecting deepfake media.</small>

        </div>

        <form id="registerForm">

            <div class="input-group">

                <label>Full Name</label>

                <input
                    id="name"
                    type="text"
                    placeholder="Enter your full name"
                    required>

            </div>

            <div class="input-group">

                <label>Email Address</label>

                <input
                    id="email"
                    type="email"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="input-group">

                <label>Phone Number</label>

                <input
                    id="phone"
                    type="tel"
                    placeholder="Enter your phone number">

            </div>

            <div class="input-group">

                <label>Password</label>

                <input
                    id="password"
                    type="password"
                    placeholder="Create a password"
                    required>

            </div>

            <div class="input-group">

                <label>Confirm Password</label>

                <input
                    id="confirmPassword"
                    type="password"
                    placeholder="Confirm your password"
                    required>

            </div>

            <div class="terms">

                <label>

                    <input type="checkbox" required>

                    I agree to the
                    <a href="#">Terms & Conditions</a>

                </label>

            </div>

            <button
                type="submit"
                class="login-page-btn">

                Create Account

            </button>

        </form>

        <div class="divider">

            <span>OR</span>

        </div>

        <button class="google-btn">

            Continue with Google

        </button>

        <p class="register-text">

            Already have an account?

            <a href="/login">

                Login

            </a>

        </p>

    </div>

</div>

<script src="{{ url_for('static', filename='register.js') }}"></script>

</body>

</html>
